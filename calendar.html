<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT.TEAM — Календарь</title>
    <link rel="stylesheet" href="static/style.css">
    <style>
        #calendarGrid {
            display: grid !important;
            grid-template-columns: repeat(7, 1fr) !important;
            gap: 6px !important;
            align-items: center;
        }
        .cal-weekday {
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            opacity: 0.5;
            padding: 8px 0;
        }
        .cal-day {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            min-height: 48px !important;
            height: auto !important;
            padding: 8px 4px !important;
            border-radius: 12px;
            cursor: pointer;
            overflow: visible !important;
            position: relative;
        }
        .cal-day.other-month {
            opacity: 0.3;
            cursor: default;
        }
        .cal-day.today:not(.selected) {
            border: 1.5px solid #3b82f6;
            font-weight: 700;
        }
        .cal-day.selected {
            background-color: #3b82f6 !important;
            color: #ffffff !important;
            font-weight: 700;
        }
        .cal-day-num {
            line-height: 1.2;
            font-size: 14px;
        }
        .cal-dots {
            display: flex !important;
            justify-content: center;
            align-items: center;
            gap: 3px;
            height: 7px;
            margin-top: 4px;
        }
        .cal-dot {
            width: 5px !important;
            height: 5px !important;
            border-radius: 50% !important;
            display: inline-block !important;
            flex-shrink: 0;
        }
        .cal-dot.overdue { background-color: #ef4444 !important; }
        .cal-dot.soon { background-color: #f59e0b !important; }
        .cal-dot.active { background-color: #3b82f6 !important; }
        .cal-dot.completed { background-color: #10b981 !important; }

        .cal-day.selected .cal-dot {
            box-shadow: 0 0 0 1px #ffffff;
        }
        .calendar-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 12px;
        }
        .calendar-section-header .calendar-section-title {
            margin: 0 !important;
        }
        .calendar-day-count {
            font-size: 13px;
            opacity: 0.6;
        }
        @media (min-width: 768px) {
            .calendar-layout {
                display: grid;
                grid-template-columns: 1.2fr 1fr;
                gap: 24px;
                align-items: start;
            }
            .calendar-section-header {
                margin-top: 0;
            }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <header class="app-header">
            <div class="header-inner">
                <div class="brand">
                    <span class="brand-strong">IT.</span><span class="brand-light">TEAM</span>
                    <button class="notif-btn" aria-label="Уведомления">🔔</button>
                </div>
                <div class="main-nav">
                    <h1>Календарь</h1>
                    <button class="small-btn" id="todayBtn">Сегодня</button>
                </div>
            </div>
        </header>

        <main class="main-content calendar-layout">
            <div class="calendar-widget" id="calendarWidget">
                <div class="calendar-header">
                    <span class="calendar-month" id="calendarMonth">Ноябрь 2026</span>
                    <div class="calendar-nav">
                        <button class="calendar-arrow" id="prevMonth">‹</button>
                        <button class="calendar-arrow" id="nextMonth">›</button>
                    </div>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>

            <div class="calendar-tasks-pane">
                <div class="calendar-section-header">
                    <div class="calendar-section-title" id="calendarDayTitle">18 ноября • сегодня</div>
                    <span class="calendar-day-count" id="calendarDayCount"></span>
                </div>
                <ul class="task-list calendar-task-list" id="calendarTaskList"></ul>
            </div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item" onclick="location.href=''">
                <span class="nav-icon">📋</span> Задачи
            </button>
            <button class="nav-item active" onclick="location.href='calendar'">
                <span class="nav-icon">📅</span> Календарь
            </button>
            <button class="nav-item" onclick="location.href='group'">
                <span class="nav-icon">👥</span> Группа
            </button>
        </nav>
    </div>

    <script src="static/calendar.js?v=3"></script>
</body>
</html>
