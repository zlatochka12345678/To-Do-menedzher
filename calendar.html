<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT.TEAM — Календарь</title>
    <link rel="stylesheet" href="static/style.css">
    <style>
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .cal-weekday {
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            padding: 6px 0;
        }
        .cal-day {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 6px 2px;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            font-size: 14px;
            color: var(--text-main);
        }
        .cal-day.other-month {
            opacity: 0.25;
            cursor: default;
        }
        .cal-day.today:not(.selected) {
            border: 1.5px solid var(--accent-blue);
            font-weight: 700;
        }
        .cal-day.selected {
            background-color: var(--accent-blue);
            color: #ffffff;
            font-weight: 700;
        }
        .cal-dots {
            display: flex;
            justify-content: center;
            gap: 3px;
            height: 6px;
            margin-top: 4px;
        }
        .cal-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: var(--priority-medium);
        }
        .cal-dot.completed {
            background-color: var(--priority-low);
        }
        .cal-day.selected .cal-dot {
            background-color: #ffffff;
        }
        .calendar-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 0 12px;
        }
        .calendar-day-count {
            font-size: 13px;
            color: var(--text-muted);
        }
        @media (min-width: 768px) {
            .calendar-layout {
                display: grid;
                grid-template-columns: 1.2fr 1fr;
                gap: 24px;
                align-items: start;
            }
            .calendar-section-header {
                margin-top: 0;
            }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <header class="app-header">
            <div class="brand">
                <span class="brand-strong">IT.</span><span class="brand-light">TEAM</span>
                <button type="button" class="notif-btn" id="notifBtn" aria-label="Уведомления">🔔</button>
            </div>
            <div class="main-nav">
                <h1>Календарь</h1>
                <button type="button" class="small-btn" id="todayBtn">Сегодня</button>
            </div>
        </header>

        <main class="main-content calendar-layout">
            <div class="calendar-widget">
                <div class="calendar-header">
                    <span class="calendar-month" id="calendarMonth">Ноябрь 2026</span>
                    <div class="calendar-nav">
                        <button type="button" class="calendar-arrow" id="prevMonth">‹</button>
                        <button type="button" class="calendar-arrow" id="nextMonth">›</button>
                    </div>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>

            <div class="calendar-tasks-pane">
                <div class="calendar-section-header">
                    <div class="calendar-section-title" id="calendarDayTitle">Сегодня</div>
                    <span class="calendar-day-count" id="calendarDayCount"></span>
                </div>
                <ul class="task-list calendar-task-list" id="calendarTaskList"></ul>
            </div>
        </main>

        <nav class="bottom-nav">
            <a class="nav-item" href="index.html">
                <span class="nav-icon">📋</span> Задачи
            </a>
            <a class="nav-item active" href="calendar.html">
                <span class="nav-icon">📅</span> Календарь
            </a>
            <a class="nav-item" href="group.html">
                <span class="nav-icon">👥</span> Группа
            </a>
        </nav>
    </div>

    <script src="static/calendar.js"></script>
</body>
</html>
