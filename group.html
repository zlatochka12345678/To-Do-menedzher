<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT.TEAM — Моя группа</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="app-wrapper">
        <header class="app-header">
            <div class="header-inner">
                <div class="brand">
                    <span class="brand-strong">IT.</span><span class="brand-light">TEAM</span>
                    <button type="button" class="notif-btn" id="notifBtn" aria-label="Уведомления">🔔</button>
                </div>
                <div class="main-nav">
                    <h1>Моя группа</h1>
                    <button type="button" class="small-btn" id="groupBadge">ИС-23</button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="group-stats">
                <div class="group-stat-card">
                    <span class="group-stat-num" id="studentsCount">8</span>
                    <span class="group-stat-label">Студентов</span>
                </div>
                <div class="group-stat-card">
                    <span class="group-stat-num" id="groupActiveCount">0</span>
                    <span class="group-stat-label">Активных задач</span>
                </div>
                <div class="group-stat-card">
                    <span class="group-stat-num" id="groupDoneCount">0</span>
                    <span class="group-stat-label">Выполнено</span>
                </div>
            </div>

            <div class="group-section-title">Состав группы</div>
            <ul class="member-list" id="memberList"></ul>
        </main>

        <nav class="bottom-nav">
            <button type="button" class="nav-item" onclick="location.href='index.html'">
                <span class="nav-icon">📋</span> Задачи
            </button>
            <button type="button" class="nav-item" onclick="location.href='calendar.html'">
                <span class="nav-icon">📅</span> Календарь
            </button>
            <button type="button" class="nav-item active" onclick="location.href='group.html'">
                <span class="nav-icon">👥</span> Группа
            </button>
        </nav>
    </div>

    <script src="static/group.js"></script>
</body>
</html>
