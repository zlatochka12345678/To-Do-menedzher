<!DOCTYPE html>

<body>

                <nav class="bottom-nav">

            </button>

    <script>
        function goPage(serverPath, filePath) {
            window.location.href = window.location.protocol === "file:" ? filePath : serverPath;
        }
    </script>
    <script src="static/group.js"></script>
